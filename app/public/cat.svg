<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ears -->
  <polygon points="5,10 10,2 13,11" fill="#7c3aed"/>
  <polygon points="27,10 22,2 19,11" fill="#7c3aed"/>
  <polygon points="7,9 10,4 12,10" fill="#a78bfa"/>
  <polygon points="25,9 22,4 20,10" fill="#a78bfa"/>
  <!-- face -->
  <ellipse cx="16" cy="16" rx="11" ry="9" fill="#7c3aed"/>
  <!-- eyes -->
  <ellipse cx="12" cy="15" rx="2.5" ry="3" fill="#fde68a"/>
  <ellipse cx="20" cy="15" rx="2.5" ry="3" fill="#fde68a"/>
  <ellipse cx="12" cy="15" rx="1.2" ry="2" fill="#0f1729"/>
  <ellipse cx="20" cy="15" rx="1.2" ry="2" fill="#0f1729"/>
  <!-- eye shine -->
  <circle cx="12.8" cy="14" r="0.6" fill="#fff"/>
  <circle cx="20.8" cy="14" r="0.6" fill="#fff"/>
  <!-- nose -->
  <polygon points="16,17 15,18.5 17,18.5" fill="#f472b6"/>
  <!-- mouth -->
  <path d="M15,18.5 Q16,20 17,18.5" fill="none" stroke="#0f1729" stroke-width="0.4"/>
  <!-- whiskers -->
  <line x1="6" y1="17" x2="11" y2="18" stroke="#c4b5fd" stroke-width="0.5"/>
  <line x1="6" y1="19" x2="11" y2="19" stroke="#c4b5fd" stroke-width="0.5"/>
  <line x1="26" y1="17" x2="21" y2="18" stroke="#c4b5fd" stroke-width="0.5"/>
  <line x1="26" y1="19" x2="21" y2="19" stroke="#c4b5fd" stroke-width="0.5"/>
</svg>
